name: train-model

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How far back to pull pro matches"
        required: false
        default: "365"
      limit:
        description: "Max matches"
        required: false
        default: "40000"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Train
        env:
          DAYS: ${{ github.event.inputs.days || '365' }}
          LIMIT: ${{ github.event.inputs.limit || '40000' }}
        run: python3 model/train.py
      - name: Commit the model
        run: |
          git config user.name "train-model"
          git config user.email "actions@github.com"
          git add model/draft_model.json
          git diff --cached --quiet || git commit -q -m "model: retrain on recent pro drafts"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD && break
            git pull --rebase -q origin "${{ github.ref_name }}" || true
            sleep $((2**i))
          done
