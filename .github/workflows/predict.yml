name: predict

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to wait for the draft to finish"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: predict
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Score the completed draft
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '25' }}
        run: |
          git config user.name "predict"
          git config user.email "actions@github.com"
          git pull --rebase -q origin "${{ github.ref_name }}" || true
          python3 live/predict.py
