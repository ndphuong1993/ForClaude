name: draft-watch

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to watch"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: draft-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Watch the live draft
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '40' }}
          TEAM_A: vision
          TEAM_B: spirit
        run: |
          test -n "$STEAM_API_KEY" || { echo "STEAM_API_KEY secret is missing"; exit 1; }
          git config user.name "draft-watch"
          git config user.email "actions@github.com"
          git pull --rebase -q origin "${{ github.ref_name }}" || true
          python3 live/draft.py
