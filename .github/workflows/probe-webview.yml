name: probe-webview

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Render candidate sites with headless Chromium
        run: |
          npm i -g playwright@1.47.2 >/dev/null 2>&1
          npx --yes playwright@1.47.2 install --with-deps chromium >/dev/null 2>&1
          cat > probe.js <<'JS'
          const { chromium } = require('playwright');
          const SITES = [
            'https://www.dotabuff.com/esports/leagues/19719',
            'https://stratz.com/matches/8960762254',
            'https://www.gosugamers.net/dota2/matches',
            'https://escorenews.com/en/dota-2',
            'https://ggscore.com/en/dota-2',
            'https://bo3.gg/matches/current',
            'https://liquipedia.net/dota2/The_International/2026',
            'https://www.datdota.com/matches/8960762254',
          ];
          (async () => {
            const b = await chromium.launch();
            for (const url of SITES) {
              const p = await b.newPage({ locale: 'en-US' });
              let out;
              try {
                const r = await p.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await p.waitForTimeout(5000);
                const txt = (await p.evaluate(() => document.body.innerText)).replace(/\n{2,}/g, '\n').trim();
                const blocked = /just a moment|are you human|access denied|you have been blocked|enable javascript and cookies/i.test(txt);
                const draftish = /\bban\b|\bbans\b|draft|pick phase/i.test(txt);
                out = `status=${r && r.status()} blocked=${blocked} mentions_draft=${draftish} chars=${txt.length}\n` +
                      '  ' + txt.slice(0, 700).replace(/\n/g, ' | ');
              } catch (e) {
                out = 'ERROR ' + e.message.split('\n')[0];
              }
              console.log('=================== ' + url);
              console.log(out);
              await p.close();
            }
            await b.close();
          })();
          JS
          NODE_PATH=$(npm root -g) node probe.js
